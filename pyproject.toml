[project]
name = "housecarl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kevin Fisher", email = "kfisher@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "sqlalchemy>=2.0.51",
]

[project.scripts]
housecarl = "housecarl:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.2",
    "pytest>=9.1.1",
    "ty>=0.0.69",
    "httpx2>=2.10.0",
]
