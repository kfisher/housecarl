services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: housecarl
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: housecarl
    volumes:
      - db-data:/var/lib/postgresql
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U housecarl"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./server
    environment:
      POSTGRES_USER: housecarl
      POSTGRES_HOST: db
      POSTGRES_DB: housecarl
    secrets:
      - postgres_password
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./client
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api

volumes:
  db-data:

secrets:
  postgres_password:
    file: ${SECRETS_DIR:-./secrets}/postgres_password.txt
