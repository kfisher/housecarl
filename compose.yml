services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: housecarl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: housecarl
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U housecarl"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./server
    environment:
      DATABASE_URL: postgresql+psycopg://housecarl:${POSTGRES_PASSWORD}@db/housecarl
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./client
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  db-data:
